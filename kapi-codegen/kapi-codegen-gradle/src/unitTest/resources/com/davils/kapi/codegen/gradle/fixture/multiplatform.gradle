plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.davils.kapi"
}

def classpathOf(String name) {
    return providers.gradleProperty(name).get().split(File.pathSeparator).toList()
}

kotlin {
    jvm()
    wasmJs {
        nodejs()
    }
    sourceSets {
        jvmMain {
            dependencies {
                implementation files(classpathOf("kapiJvm"))
            }
        }
        wasmJsMain {
            dependencies {
                implementation files(classpathOf("kapiWasm"))
            }
        }
    }
}

kapi {
    generatorClasspath.from(classpathOf("kapiGenerator"))
    runtimes {
        enabled = false
    }
    openApi("petstore") {
        packageName = "com.example.petstore"
        artifacts {
            client = true
            server = true
        }
    }
}
