asyncapi: 3.0.0
info:
  title: Hostile
  version: '1'
servers:
  local:
    host: localhost
    protocol: ws
channels:
  class:
    address: /fun/{in}
    summary: "Ends */ a comment, /* opens one, @param x, ‮ reversed, ${injected}, · and ♢ and %s"
    parameters:
      in:
        description: "*/ fun x() {}"
        enum: ["a*/b", "${c}"]
    messages:
      object:
        $ref: '#/components/messages/object'
      Companion:
        $ref: '#/components/messages/Companion'
      when:
        $ref: '#/components/messages/when'
    bindings:
      ws:
        query:
          type: object
          required: ["for $x */ ‮"]
          properties:
            "for $x */ ‮":
              type: string
              enum: ["a\"b", "${c}‮"]
        headers:
          type: object
          properties:
            X-$:
              type: integer
            Sec-WebSocket-Protocol:
              type: string
              const: "v1.$"
operations:
  do:
    action: receive
    channel:
      $ref: '#/channels/class'
    messages:
      - $ref: '#/channels/class/messages/object'
      - $ref: '#/channels/class/messages/Companion'
    reply:
      messages:
        - $ref: '#/channels/class/messages/when'
components:
  correlationIds:
    weird:
      location: '$message.payload#/a$b~1c'
  messages:
    object:
      summary: "*/ class Evil { init { error(\"x\") } } /*"
      correlationId:
        $ref: '#/components/correlationIds/weird'
      payload:
        type: object
        required: [kind, a$b/c]
        properties:
          kind:
            type: string
            const: "obj*/\"${x}‮\n·♢%"
          a$b/c:
            type: string
    Companion:
      correlationId:
        $ref: '#/components/correlationIds/weird'
      payload:
        type: object
        required: [kind, a$b/c]
        properties:
          kind:
            type: string
            const: companion
          a$b/c:
            type: string
    when:
      correlationId:
        $ref: '#/components/correlationIds/weird'
      payload:
        type: object
        required: [a$b/c]
        properties:
          a$b/c:
            type: string
