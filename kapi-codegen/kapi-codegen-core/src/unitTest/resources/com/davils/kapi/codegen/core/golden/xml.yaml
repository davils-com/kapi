openapi: 3.1.0
info:
  title: Shop
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: The order as placed
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order exists
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getOrder
      tags: [orders]
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            text/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No such order
    put:
      operationId: noteOrder
      tags: [orders]
      requestBody:
        content:
          application/vnd.shop.note+xml:
            schema:
              $ref: '#/components/schemas/Note'
      responses:
        '200':
          description: The order with the note
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No such order
  /orders/{orderId}/receipt:
    get:
      operationId: getReceipt
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The receipt as it was printed
          content:
            application/xml: {}
components:
  schemas:
    Order:
      type: object
      required: [id, items]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/Status'
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Item'
        note:
          type: string
        placed:
          type: string
          format: date-time
          readOnly: true
    Item:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
        tags:
          type: array
          items:
            type: string
    Note:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 200
    Status:
      type: string
      enum: [open, shipped]
