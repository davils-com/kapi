openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      responses:
        '200':
          description: The pets
          headers:
            X-Total:
              required: true
              schema:
                type: integer
                format: int32
            X-Next:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '409':
          description: Exists
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getPet
      tags: [pets]
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Unknown
    delete:
      operationId: deletePet
      tags: [pets]
      responses:
        '204':
          description: Gone
        '404':
          description: Unknown
  /pets/{petId}/avatar:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getAvatar
      tags: [pets]
      responses:
        '200':
          description: The picture
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown
  /animals:
    get:
      operationId: listAnimals
      tags: [zoo]
      responses:
        2XX:
          description: The animals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal'
  /trees:
    get:
      operationId: getTree
      tags: [zoo]
      responses:
        '404':
          description: Unknown
        default:
          description: A tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tree'
  /stamps:
    get:
      operationId: getStamp
      tags: [admin]
      responses:
        '200':
          description: A stamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stamp'
  /health:
    get:
      operationId: getHealth
      tags: [admin]
      responses:
        '503':
          description: Down
components:
  schemas:
    Status:
      type: string
      enum: [open, closed]
    Pet:
      type: object
      required: [name, status, born]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        name:
          type: string
          minLength: 2
          maxLength: 8
          pattern: '^[A-Z][a-z]+$'
          examples: [Rex]
        status:
          $ref: '#/components/schemas/Status'
        born:
          type: [string, 'null']
          format: date-time
        tags:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            minLength: 3
            maxLength: 4
        owner:
          $ref: '#/components/schemas/Owner'
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        scores:
          type: object
          minProperties: 2
          additionalProperties:
            type: number
            minimum: 1
            multipleOf: 0.5
        photo:
          type: string
          format: byte
        weight:
          type: number
          format: float
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        legs:
          type: integer
          format: int32
          minimum: 3
          multipleOf: 2
        chipped:
          type: boolean
          const: true
        extra: {}
    Owner:
      type: object
      required: [email]
      properties:
        email:
          type: string
          pattern: '^.+@.+$'
          default: owner@example.com
          x-kapi-sensitive: true
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        card:
          type: string
        expiry:
          type: string
          pattern: '^[0-9]{2}/[0-9]{2}$'
      dependentRequired:
        card: [expiry]
    Animal:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          hound: '#/components/schemas/Dog'
    Cat:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
        name:
          type: string
        rival:
          $ref: '#/components/schemas/Animal'
    Dog:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        friend:
          $ref: '#/components/schemas/Animal'
    Tree:
      oneOf:
        - $ref: '#/components/schemas/Branch'
        - $ref: '#/components/schemas/Leaf'
    Branch:
      type: object
      required: [children]
      properties:
        children:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Tree'
    Leaf:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          format: int32
    Stamp:
      type: object
      required: [at]
      properties:
        at:
          type: string
          x-kapi-type: kotlin.time.Duration
    Loop:
      type: object
      required: [next]
      properties:
        next:
          $ref: '#/components/schemas/Loop'
