# What the pipeline of kapi does. Every key overrides a default of
# actions/plan/defaults.yml in davils-com/kotlin-workflow; a key that is not there stops the run.
version: 1
gradle:
  args: ["--stacktrace"]

check:
  tasks: [check]
  reproducible:
    clean-tasks:
      - ":kapi-spec:kapi-spec-core:clean"
      - ":kapi-spec:kapi-spec-schema:clean"
      - ":kapi-spec:kapi-spec-openapi:clean"
      - ":kapi-runtime:kapi-runtime-core:clean"
      - ":kapi-codegen:kapi-codegen-core:clean"
      - ":kapi-codegen:kapi-codegen-gradle:clean"
    tasks:
      - ":kapi-spec:kapi-spec-core:jvmJar"
      - ":kapi-spec:kapi-spec-schema:jvmJar"
      - ":kapi-spec:kapi-spec-openapi:jvmJar"
      - ":kapi-runtime:kapi-runtime-core:jvmJar"
      - ":kapi-codegen:kapi-codegen-core:jar"
      - ":kapi-codegen:kapi-codegen-gradle:jar"
    artifacts:
      - "kapi-spec/kapi-spec-core/build/libs/*.jar"
      - "kapi-spec/kapi-spec-schema/build/libs/*.jar"
      - "kapi-spec/kapi-spec-openapi/build/libs/*.jar"
      - "kapi-runtime/kapi-runtime-core/build/libs/*.jar"
      - "kapi-codegen/kapi-codegen-core/build/libs/*.jar"
      - "kapi-codegen/kapi-codegen-gradle/build/libs/*.jar"

policy:
  # Line breaks, paths and timers differ on Windows, and kapi reads documents from files and serves real sockets in
  # its tests, so develop, main and a tag run there too.
  push-develop:
    stages: [check, snapshot]
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  push-main:
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  tag:
    os: [ubuntu-latest, windows-latest]

security:
  gradle:
    tasks:
      - "kreateAssurance"
  dependency-submission:
    enabled: false

publish:
  build-tasks: [assemble]
  tasks:
    - ":kapi-spec:kapi-spec-core:publishAllPublicationsToDavilsRepository"
    - ":kapi-spec:kapi-spec-schema:publishAllPublicationsToDavilsRepository"
    - ":kapi-spec:kapi-spec-openapi:publishAllPublicationsToDavilsRepository"
    - ":kapi-runtime:kapi-runtime-core:publishAllPublicationsToDavilsRepository"
    - ":kapi-codegen:kapi-codegen-core:publishAllPublicationsToDavilsRepository"
    - ":kapi-codegen:kapi-codegen-gradle:publishAllPublicationsToDavilsRepository"

snapshot:
  # kapi's own build makes every build without a release tag a snapshot.
  kreate-snapshot: false

release:
  publications:
    discovery: explicit
    # In upload order: the publication of every target before the multiplatform publication that names them.
    list:
      - path: com/davils/kapi-spec-core-jvm
        artifact: kapi-spec-core-jvm
        task: ":kapi-spec:kapi-spec-core:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-core-wasm-js
        artifact: kapi-spec-core-wasm-js
        task: ":kapi-spec:kapi-spec-core:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-core
        artifact: kapi-spec-core
        task: ":kapi-spec:kapi-spec-core:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-schema-jvm
        artifact: kapi-spec-schema-jvm
        task: ":kapi-spec:kapi-spec-schema:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-schema-wasm-js
        artifact: kapi-spec-schema-wasm-js
        task: ":kapi-spec:kapi-spec-schema:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-schema
        artifact: kapi-spec-schema
        task: ":kapi-spec:kapi-spec-schema:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-openapi-jvm
        artifact: kapi-spec-openapi-jvm
        task: ":kapi-spec:kapi-spec-openapi:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-openapi-wasm-js
        artifact: kapi-spec-openapi-wasm-js
        task: ":kapi-spec:kapi-spec-openapi:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kapi-spec-openapi
        artifact: kapi-spec-openapi
        task: ":kapi-spec:kapi-spec-openapi:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kapi-runtime-core-jvm
        artifact: kapi-runtime-core-jvm
        task: ":kapi-runtime:kapi-runtime-core:publishJvmPublicationToDavilsRepository"
      - path: com/davils/kapi-runtime-core-wasm-js
        artifact: kapi-runtime-core-wasm-js
        task: ":kapi-runtime:kapi-runtime-core:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/kapi-runtime-core
        artifact: kapi-runtime-core
        task: ":kapi-runtime:kapi-runtime-core:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/kapi-codegen-core
        artifact: kapi-codegen-core
        task: ":kapi-codegen:kapi-codegen-core:publishMavenPublicationToDavilsRepository"
      - path: com/davils/kapi-codegen-gradle
        artifact: kapi-codegen-gradle
        task: ":kapi-codegen:kapi-codegen-gradle:publishPluginMavenPublicationToDavilsRepository"
      - path: com/davils/kapi/com.davils.kapi.gradle.plugin
        artifact: com.davils.kapi.gradle.plugin
        task: ":kapi-codegen:kapi-codegen-gradle:publishKapiPluginMarkerMavenPublicationToDavilsRepository"
  attest:
    subjects:
      - "kapi-spec/kapi-spec-core/build/libs/*.jar"
      - "kapi-spec/kapi-spec-core/build/libs/*.klib"
      - "kapi-spec/kapi-spec-schema/build/libs/*.jar"
      - "kapi-spec/kapi-spec-schema/build/libs/*.klib"
      - "kapi-spec/kapi-spec-openapi/build/libs/*.jar"
      - "kapi-spec/kapi-spec-openapi/build/libs/*.klib"
      - "kapi-runtime/kapi-runtime-core/build/libs/*.jar"
      - "kapi-runtime/kapi-runtime-core/build/libs/*.klib"
      - "kapi-codegen/kapi-codegen-core/build/libs/*.jar"
      - "kapi-codegen/kapi-codegen-gradle/build/libs/*.jar"
  github-release:
    enabled: false

# How a pull request of Dependabot repairs itself, see CONTRIBUTING.md, "Changing a Dependency".
dependencies:
  lock:
    invocations:
      - ["kreateResolveAndLockAll", "--write-locks", "--no-configuration-cache"]
  verification:
    tasks: [check]
