[versions]
kotlin = "2.4.21"
kreate = "5.5.2"
kore = "2.5.0"
konfetti = "1.1.0"
kollect = "1.1.0"
kaml = "1.0.1"
krypt = "1.2.0"
kontinuity = "1.2.0"
konnect = "1.2.0"
ktor = "3.6.1"
kotlinpoet = "2.4.0"
coroutines = "1.11.0"
kotlinx-io = "0.9.3"
serialization = "1.13.0"
# Floors for the classpaths of build tools, raised past known vulnerabilities.
tooling-jackson = "2.23.0"
tooling-bouncycastle = "1.87"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kreate-gradle-plugin = { module = "com.davils.kreate:com.davils.kreate.gradle.plugin", version.ref = "kreate" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-serialization-compiler-plugin-embeddable = { module = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable", version.ref = "kotlin" }
kore-core = { module = "com.davils:kore-core", version.ref = "kore" }
kore-testing = { module = "com.davils:kore-testing", version.ref = "kore" }
konfetti-core = { module = "com.davils:konfetti-core", version.ref = "konfetti" }
konfetti-testing = { module = "com.davils:konfetti-testing", version.ref = "konfetti" }
kollect-core = { module = "com.davils:kollect-core", version.ref = "kollect" }
kaml-core = { module = "com.davils:kaml-core", version.ref = "kaml" }
kaml-document = { module = "com.davils:kaml-document", version.ref = "kaml" }
krypt-primitive = { module = "com.davils:krypt-primitive", version.ref = "krypt" }
kontinuity-core = { module = "com.davils:kontinuity-core", version.ref = "kontinuity" }
kontinuity-policy = { module = "com.davils:kontinuity-policy", version.ref = "kontinuity" }
kontinuity-retry = { module = "com.davils:kontinuity-retry", version.ref = "kontinuity" }
kontinuity-circuit-breaker = { module = "com.davils:kontinuity-circuit-breaker", version.ref = "kontinuity" }
kontinuity-cache = { module = "com.davils:kontinuity-cache", version.ref = "kontinuity" }
kontinuity-bulkhead = { module = "com.davils:kontinuity-bulkhead", version.ref = "kontinuity" }
kontinuity-rate-limiter = { module = "com.davils:kontinuity-rate-limiter", version.ref = "kontinuity" }
konnect-core = { module = "com.davils:konnect-core", version.ref = "konnect" }
konnect-internet-protocol = { module = "com.davils:konnect-internet-protocol", version.ref = "konnect" }
konnect-ipc-server = { module = "com.davils:konnect-ipc-server", version.ref = "konnect" }
krypt-jose = { module = "com.davils:krypt-jose", version.ref = "krypt" }
krypt-x509 = { module = "com.davils:krypt-x509", version.ref = "krypt" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }

[bundles]
build-logic = [
    "kotlin-gradle-plugin",
    "kotlin-serialization-gradle-plugin",
    "kreate-gradle-plugin"
]
